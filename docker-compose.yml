version: '3.8'

services:
  web:
    build: ./typeracer_clone_django
    command: python typeracer_clone_django/manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - 8000:8000
    env_file:
      - ./docker.env
    depends_on:
      - db
  db:
    image: 'postgres:15'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
    ports:
      - 5432:5432
  redis:
    image: redis:6
    ports:
      - "6379:6379"

volumes:
  postgres_data:
